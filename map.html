<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live map — Footclaim</title>
<meta name="description" content="Every zone held right now: who walked the loop, how big it is and when it burns out. Plus the leaderboard.">
<meta property="og:title" content="Footclaim live map">
<meta property="og:description" content="Zones claimed on foot, live. Walk a loop and the ground inside is yours.">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="map.css?v=6">
</head>
<body class="map-page">
<header class="site">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Footclaim home">
      <svg width="30" height="30" viewBox="5.5 2.2 15 20.5" fill="none" aria-hidden="true"><path d="M9.4 10.6 C9.6 8.6 13.6 7.6 15.6 9.2 C17.2 10.6 16.6 13.4 15.6 15.6 C14.9 17.2 15.4 19.4 14.4 21 C13.4 22.6 10.6 22.6 10.2 20.6 C9.8 18.8 11.4 17.2 11 15.2 C10.7 13.6 9.2 12.6 9.4 10.6 Z" stroke="#A7D457" stroke-width="2" stroke-linejoin="round"/><circle cx="9.4" cy="5.7" r="1.9" fill="#fff"/><circle cx="12.6" cy="4.5" r="1.35" fill="#fff"/><circle cx="15.1" cy="5.0" r="1.15" fill="#fff"/><circle cx="17.0" cy="6.3" r="0.95" fill="#fff"/><circle cx="18.2" cy="8.0" r="0.8" fill="#fff"/></svg>
      <span>FOOTCLAIM</span>
    </a>
    <nav aria-label="Site">
      <a href="map" aria-current="page">Map</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </div>
</header>

<main class="map-wrap">
  <div id="map" role="region" aria-label="Map of zones"></div>
  <p id="map-fallback" class="map-fallback" hidden></p>

  <button id="locate" class="map-button" type="button" aria-label="Show the map around me">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L21 3 L13 21 L11 13 Z" fill="currentColor"/></svg>
  </button>

  <aside id="panel" class="panel" aria-label="Zone and leaderboard">
    <div class="grip" aria-hidden="true"></div>
    <p id="notice" class="notice" role="status" hidden></p>

    <section id="zone" class="zone" hidden aria-labelledby="zone-name">
      <div id="zone-band" class="zone-band">
        <span id="zone-badge" class="zone-badge"></span>
        <button id="zone-close" class="band-button" type="button" aria-label="Close zone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <img id="zone-logo" class="zone-sticker" alt="" hidden>
      <div class="zone-body">
        <div class="zone-title">
          <h2 id="zone-name"></h2>
          <p id="zone-meta" class="zone-by"></p>
        </div>
        <p id="zone-text" class="zone-text" hidden></p>
        <p class="zone-facts">
          <span class="fact">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A9B0D6" stroke-width="2.2" stroke-dasharray="3 3" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
            <span id="zone-area"></span>
          </span>
          <span class="fact-divider" aria-hidden="true"></span>
          <span class="fact">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF9A3D" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/></svg>
            <span id="timer-label" class="visually-hidden">Burns out in</span>
            <span id="timer-clock" class="clock"></span>
            <span id="timer-left" class="muted">left</span>
          </span>
        </p>
        <a id="zone-link" class="zone-link-row" href="#" rel="nofollow noopener ugc" target="_blank" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7D457" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
          <span id="zone-link-text"></span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A9B0D6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16L16 8"/><path d="M9 8h7v7"/></svg>
        </a>
        <div class="zone-actions">
          <button id="zone-share" class="zone-action" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
            <span id="zone-share-label">Share</span>
          </button>
          <a id="zone-report" class="zone-action" href="#">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>
            Report
          </a>
        </div>
      </div>
    </section>

    <section class="board" aria-labelledby="board-title">
      <h2 id="board-title">Leaderboard</h2>
      <div class="tabs" role="tablist" aria-label="Leaderboard">
        <button id="tab-global" role="tab" type="button" aria-selected="true" aria-controls="board-list">Global</button>
        <button id="tab-local" role="tab" type="button" aria-selected="false" aria-controls="board-list">This area · 100 km</button>
      </div>
      <p id="board-caption" class="caption">Everyone, ranked by the ground they hold right now.</p>
      <ol id="board-list" class="board-list" aria-live="polite"></ol>
    </section>

    <section class="join">
      <p><strong>Walk a loop, own the ground inside.</strong> Footclaim is in a closed beta on iPhone in Limassol.</p>
      <a class="button" href="mailto:hello@footclaim.app?subject=Footclaim%20beta">Ask to join the beta</a>
    </section>
  </aside>
</main>

<script src="map.js?v=6" defer></script>
</body>
</html>
